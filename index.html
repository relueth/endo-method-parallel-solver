    <!-- React Fast Refresh Preamble Shim for Vite Middleware & Tunnel Access -->
    <script>
      window.__vite_plugin_react_preamble_installed__ = true;
      window.$RefreshReg$ = () => {};
      window.$RefreshSig$ = () => (type) => type;

      // Prevent Vite Dev Server HMR from spamming :24678 connection errors over Cloudflare Tunnel
      (function() {
        if (typeof window !== "undefined" && window.WebSocket) {
          const NativeWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            const urlStr = String(url || "");
            if (urlStr.includes(":24678") || (urlStr.includes("token=") && urlStr.includes("trycloudflare.com"))) {
              const dummy = {
                readyState: 3, // CLOSED
                send: () => {},
                close: () => {},
                addEventListener: () => {},
                removeEventListener: () => {},
                dispatchEvent: () => false,
                set onopen(fn) {},
                set onclose(fn) {},
                set onerror(fn) {},
                set onmessage(fn) {},
              };
              return dummy;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          window.WebSocket.OPEN = NativeWebSocket.OPEN;
          window.WebSocket.CLOSING = NativeWebSocket.CLOSING;
          window.WebSocket.CLOSED = NativeWebSocket.CLOSED;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
